server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: notification-service

  data:
    mongodb:
      uri: ${MONGODB_NOTIFICATIONS_URI:mongodb://localhost:27017/earthscan_notifications}
      auto-index-creation: true   # The unique sourceEventId index is what makes consumers idempotent.

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 2
        max-concurrency: 5
        prefetch: 10
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 4
          multiplier: 2.0
          max-interval: 20s
        default-requeue-rejected: false

earthscan:
  jwt:
    secret: ${JWT_SECRET:ChangeMeInProductionEarthScanBharat2026SigningKey}
    issuer: ${JWT_ISSUER:EarthScanBackend}
    audience: ${JWT_AUDIENCE:EarthScanUsers}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.earthscan: ${LOG_LEVEL_EARTHSCAN:INFO}

# ===========================================================================
# PROFILES
# ===========================================================================
---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.earthscan: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: test
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  cloud:
    discovery:
      enabled: false
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
earthscan:
  jwt:
    secret: TestOnlySigningKeyForEarthScanBharatIntegrationTests2026
logging:
  level:
    root: WARN
    com.earthscan: INFO

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    root: WARN
    com.earthscan: INFO
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
