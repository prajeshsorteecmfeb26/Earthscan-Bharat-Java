# ---------------------------------------------------------------------------
# EarthScan Bharat — full local stack.
#
#   cd docker
#   cp .env.example .env      # then edit JWT_SECRET and the passwords
#   docker compose up --build
#
# Paths are relative to this file, which lives in docker/. Backend images build from
# ../backend (the Maven reactor); the frontend image builds from the repository root
# because it needs both frontend/ and docker/nginx.conf.
#
# Startup order is enforced with healthchecks rather than plain depends_on.
# `depends_on` alone only waits for the container to start, not for MySQL to
# finish initialising, so the services would race the databases and crash-loop.
# ---------------------------------------------------------------------------

services:

  # ------------------------------------------------------------ infrastructure
  mysql:
    image: mysql:8.4
    container_name: earthscan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      # Both service schemas are created up front. Each service owns exactly one
      # and never reads the other's tables — that separation is the point of the
      # split, and sharing one schema would quietly re-couple them.
      MYSQL_DATABASE: earthscan_auth
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [earthscan]
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: earthscan-mongodb
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ../database/mongodb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [earthscan]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: earthscan-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"   # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks: [earthscan]
    restart: unless-stopped

  # --------------------------------------------------------------- discovery
  discovery-server:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
      args:
        MODULE: discovery-server
        PORT: 8761
    container_name: earthscan-discovery
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_HOSTNAME: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks: [earthscan]
    restart: unless-stopped

  # ------------------------------------------------------------ business services
  auth-service:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
      args:
        MODULE: auth-service
        PORT: 8081
    container_name: earthscan-auth
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_AUTH_DB: earthscan_auth
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - see .env.example}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@earthscan.in}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8081:8081"
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [earthscan]
    restart: unless-stopped

  land-service:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
      args:
        MODULE: land-service
        PORT: 8082
    container_name: earthscan-land
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_LAND_DB: earthscan_land
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SEED_DEMO_LISTINGS: ${SEED_DEMO_LISTINGS:-true}
    ports:
      - "8082:8082"
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [earthscan]
    restart: unless-stopped

  forum-service:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
      args:
        MODULE: forum-service
        PORT: 8083
    container_name: earthscan-forum
    environment:
      MONGODB_URI: mongodb://mongodb:27017/earthscan_forum
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    ports:
      - "8083:8083"
    depends_on:
      mongodb: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [earthscan]
    restart: unless-stopped

  notification-service:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
      args:
        MODULE: notification-service
        PORT: 8084
    container_name: earthscan-notification
    environment:
      MONGODB_NOTIFICATIONS_URI: mongodb://mongodb:27017/earthscan_notifications
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    ports:
      - "8084:8084"
    depends_on:
      mongodb: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [earthscan]
    restart: unless-stopped

  # ------------------------------------------------------------------ gateway
  api-gateway:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
      args:
        MODULE: api-gateway
        PORT: 8080
    container_name: earthscan-gateway
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173,http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      discovery-server: { condition: service_healthy }
      auth-service: { condition: service_started }
      land-service: { condition: service_started }
      forum-service: { condition: service_started }
      notification-service: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [earthscan]
    restart: unless-stopped

  # ----------------------------------------------------------------- frontend
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: earthscan-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api-gateway: { condition: service_started }
    networks: [earthscan]
    restart: unless-stopped

networks:
  earthscan:
    driver: bridge

volumes:
  mysql-data:
  mongo-data:
  rabbitmq-data:
