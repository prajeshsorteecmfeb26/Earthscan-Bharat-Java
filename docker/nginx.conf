server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip on text assets. The Vite bundle is a few hundred KB of JS, and this
    # matters disproportionately for the rural mobile connections many of the
    # platform's users are on.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml font/woff font/woff2;

    # Hashed filenames from the Vite build are immutable, so they can be cached
    # indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a returning visitor keeps loading the
    # old build's asset references after a deploy and sees a blank page.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Single-page app: react-router owns the routes, so any unmatched path has
    # to fall through to index.html rather than 404. Without this, refreshing
    # the page on /admin/users returns nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Baseline security headers. Note there is deliberately no
    # Content-Security-Policy here: the app uses MUI's emotion runtime, which
    # injects inline styles, so a useful CSP needs nonce plumbing through the
    # build rather than a header added blind.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /50x.html {
        internal;
    }
    error_page 500 502 503 504 /50x.html;
}
